spring:
  application:
    name: pulse
  datasource:
    # The compose.yaml database. Development-only credentials; override with SPRING_DATASOURCE_URL,
    # SPRING_DATASOURCE_USERNAME and SPRING_DATASOURCE_PASSWORD anywhere else.
    url: jdbc:postgresql://localhost:5432/pulse
    username: pulse
    password: pulse
  liquibase:
    # Applied at startup, before anything is ingested. If the database is unreachable the app
    # refuses to start rather than polling feeds into nowhere.
    change-log: classpath:db/changelog/db.changelog-master.xml
    # Liquibase otherwise contacts config.liquibase.com at every startup to send usage analytics.
    analytics-enabled: false

server:
  # Only reachable from this machine. The metrics and health endpoints aren't meant for the network.
  address: 127.0.0.1
  port: 8080

management:
  endpoints:
    web:
      exposure:
        # http://localhost:8080/actuator/health and /actuator/metrics; nothing else is exposed.
        include: health, metrics
  endpoint:
    health:
      # Show which component is down (e.g. the database), not just "DOWN".
      show-details: always

logging:
  charset:
    # Write logs as UTF-8 regardless of the OS default (Windows consoles often use cp1252,
    # which turned em dashes and curly quotes in feed titles into "�").
    console: UTF-8

pulse:
  rss:
    enabled: true
    # Pause between the end of one round of polls and the start of the next.
    poll-interval: 5m
    # Maximum time for one complete fetch, body included.
    fetch-deadline: 10s
    # Larger feeds are rejected while downloading.
    max-feed-size: 5MB
    # A mix of tech news, community links and research, in different formats.
    feeds:
      - https://hnrss.org/frontpage
      - https://lobste.rs/rss
      - https://feeds.arstechnica.com/arstechnica/index
      - https://feeds.bbci.co.uk/news/technology/rss.xml
      - https://rss.arxiv.org/rss/cs.AI
