spring:
  application:
    name: pulse

pulse:
  rss:
    # Off until an EventSink implementation exists (Phase 2d).
    enabled: false
    # Pause between the end of one round of polls and the start of the next.
    poll-interval: 5m
    # Maximum time for one complete fetch, body included.
    fetch-deadline: 10s
    # Larger feeds are rejected while downloading.
    max-feed-size: 5MB
    # Feed URLs to poll, e.g.:
    # feeds:
    #   - https://hnrss.org/frontpage
